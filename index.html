<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Green Horizon</title>
  <style>
    :root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0f1720;color:#e7edf3}.card{width:min(680px,92vw);padding:44px;border:1px solid #2a3948;border-radius:22px;background:#15212c;box-shadow:0 18px 60px rgba(0,0,0,.22)}.eyebrow{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;opacity:.62}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#70c9a2;margin-right:8px}h1{margin:12px 0 10px;font-size:clamp(2rem,7vw,4rem);line-height:1}.sub{margin:0;color:#aebdca;font-size:1rem;line-height:1.65}.rule{height:1px;background:#263746;margin:28px 0}.status{font-size:.92rem;color:#8ea0af}</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow"><span class="dot"></span>service online</div>
    <h1>Green Horizon</h1>
    <p class="sub">A private application endpoint is running normally. No public interface is available from this page.</p>
    <div class="rule"></div>
    <div class="status">HTTP service active</div>
  </main>
</body>
</html>
